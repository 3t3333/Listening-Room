[package]
name = "listening-room"
version = "0.2.3"
description = "A spatial Spotify listening room"
edition = "2024"

[lib]
name = "listening_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
legacy-web-api = ["dep:dotenvy", "dep:rspotify"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
cpal = "0.16.0"
dotenvy = { version = "0.15.7", optional = true }
env_logger = "0.11.11"
futures = "0.3.31"
librespot = { git = "https://github.com/3t3333/librespot", rev = "3c9901c", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots", "with-libmdns"] }
log = "0.4.34"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
rspotify = { version = "0.16.1", features = ["cli"], optional = true }
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-wallpaper = "4"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.24.0"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
